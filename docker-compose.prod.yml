services:
  db:
    image: postgis/postgis:16-3.4
    container_name: forest_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-forest}
      POSTGRES_PASSWORD: ${DB_PASS:-forest}
      POSTGRES_DB: ${DB_NAME:-forest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  raster:
    build:
      context: ../raster
      dockerfile: Dockerfile
    container_name: forest_raster_prod
    environment:
      - FORMS_T_PATH=/data/FORMS-T
      - GFC_PATH=/data/global-forest-change
      - LIDAR_PATH=/data/lidar-hd
    volumes:
      - ${FOREST_DATA_ROOT:-../forest-res}:/data:ro
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: forest_backend_prod
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-forest}
      - DB_PASS=${DB_PASS:-forest}
      - DB_NAME=${DB_NAME:-forest}
      - JWT_SECRET=${JWT_SECRET:-production_secret_change_me}
      - JWT_EXPIRES_IN=1d
      - RASTER_TIMEOUT_MS=15000
      - RASTER_LIDAR_TIMEOUT_MS=90000
      - RASTER_SERVICE_URL=http://raster:8000
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: forest_frontend_prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_BASE_URL=http://backend:4000
    networks:
      - internal
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: forest_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
      - edge
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    name: forest-bd-viewer_pgdata
    external: true

networks:
  internal:
    internal: true
  edge:
